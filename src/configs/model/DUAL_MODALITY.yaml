embedding_size: 64
feat_embed_dim: 64

learning_rate_scheduler: [0.96, 50]
learning_rate: 0.001

# PGL propagation and multimodal item graph.
n_ui_layers: 2
n_mm_layers: 1
knn_k: 10
# separate: propagate image with A_image and text with A_text.
# mixed: propagate both feature tables with the weighted mixed graph.
mm_graph_mode: separate
# Used only by mixed mode to build alpha*A_image + (1-alpha)*A_text.
mm_image_weight: 0.1

# User-normalized relative-edge-weight ablations:
# uniform: r_ui=1, with no learnable edge logits.
# shared: one learnable edge-logit table is shared by image and text.
# separate: independent image/text edge-logit tables.
# sigmoid: legacy sigmoid mask behavior configured by the options below.
mask_weight_mode: separate
# gamma is learned independently for image/text and applied at every masked
# propagation step. The same initialization should be used across ablations.
mask_gamma_init: 0.5
mask_weight_eps: 1.0e-7

# Normalized uniform/shared/separate modes require edge_logits. In legacy
# sigmoid mode, feature_network computes f_m([user || item || user*item]).
mask_generation_mode: edge_logits
mask_hidden_dim: 64

# Legacy sigmoid option; normalized modes derive sharing from mask_weight_mode.
# Feature-network mode uses independent image/text mask networks.
mask_sharing_mode: separate
# normal during training; the checkpoint swap-analysis script changes this
# temporarily to swapped without modifying checkpoint parameters.
mask_assignment_mode: normal

# shared: concatenate modalities first, then use one full-vs-masked gate.
# separate: fuse full/masked inside each modality using two gates.
fusion_gate_mode: shared

# Each modality has a full and a masked U-I branch.
mask_graph_mode: soft
mask_degree_mode: masked
# keep_ratio/binary_weight are only used by legacy sigmoid masking (apart
# from the optional top-k proxy stored for analysis).
mask_keep_ratio: 0.3
hard_mask_temperature: 1.0
# Keep this at zero for user-normalized modes: q already sums to one inside
# each user's history and r=d_u*q has global mean one.
mask_weight: 0.0
mask_binary_weight: 0.1

# user_js is available only for separate image/text edge weights. Leave it
# disabled when comparing uniform/shared/separate so the ablations differ
# only in their edge-weight parameterization; JS is still logged either way.
mask_specialization_mode: none
mask_specialization_weight: 0.0
mask_specialization_margin: 0.1
mask_specialization_eps: 1.0e-8

# full_masked_concat: CL between concat(image, text) full/masked views.
# full_masked_per_modality: four separate user/item image/text SymNCE terms.
# pgl_dropout: original PGL dropout-view CL on the final embeddings.
# cl_weight: 0 disables InfoNCE completely in either mode.
cl_mode: full_masked_per_modality
cl_weight: 0.1
cl_temperature: 0.2
dropout: 0.2

# masked_branch: BPR directly on each masked U-I branch before fusion/I-I.
# modality: BPR on each modality after full-mask fusion and item I-I addition.
# none: use joint BPR only. A zero weight also disables auxiliary BPR.
aux_bpr_mode: masked_branch
aux_bpr_weight: 0.1

# Auxiliary-modality negative sampling. ``random`` is the backward-compatible
# baseline and builds no extra pool. Structured modes require
# aux_bpr_mode: modality when aux_bpr_weight is non-zero.
negative_sampler_mode: random  # random | modality | modality_cf
structured_negative_ratio: 0.2
structured_negative_weight: 1.0
structured_pool_size: 100
structured_difference_quantile: 0.5
structured_min_item_interactions: 5
structured_cf_threshold: 0.2  # used only by modality_cf
# KNN is computed in query blocks; no dense n_items x n_items matrix is kept.
structured_knn_block_size: 256

save_analysis_artifacts: True
restore_best_model: True

hyper_parameters: []
