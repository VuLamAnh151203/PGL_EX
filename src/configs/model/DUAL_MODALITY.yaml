embedding_size: 64
feat_embed_dim: 64

learning_rate_scheduler: [0.96, 50]
learning_rate: 0.001

# PGL propagation and multimodal item graph.
n_ui_layers: 2
n_mm_layers: 1
knn_k: 10
mm_image_weight: 0.1

# Each modality has a full and an independently masked U-I branch.
mask_graph_mode: hard
mask_degree_mode: full
mask_keep_ratio: 0.3
hard_mask_temperature: 1.0
mask_weight: 0.1
mask_binary_weight: 0.1

# Original PGL dropout-view CL. Zero disables InfoNCE completely.
cl_weight: 0.0
cl_temperature: 0.2
dropout: 0.2

save_analysis_artifacts: True
restore_best_model: True

hyper_parameters: []
