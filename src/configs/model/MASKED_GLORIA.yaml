embedding_size: 64
feat_embed_dim: 64

learning_rate_scheduler: [0.96, 50]
learning_rate: 0.001

# Multimodal item-item graph.
n_mm_layers: 1
knn_k: 10
mm_image_weight: 0.1

# id: multimodal features only define the I-I graph.
# multimodal: projected image/text features remain concatenated in 2d, while
# user_image and user_text provide the matching two user-side tables.
item_embedding_mode: multimodal

# parallel (PGL): I-I propagates the original multimodal item features.
# sequential: each branch's U-I item output propagates through I-I separately.
mm_propagation_mode: sequential

# concat: preserve the GLORIA branch concatenation (final width 4d).
# gated_sum: PGL-style gated sum after I-I propagation (final width 2d).
# Keeping gated_sum fixed lets parallel/sequential be compared at equal width.
aggr_mode: add
# fusion: gated_sum
fusion: concat
# Soft interaction-mask budget and binarization regularizer.
mask_keep_ratio: 0.3
mask_weight: 0.1
mask_binary_weight: 0.1

# Original PGL dropout-view contrastive learning. Set cl_weight to 0.0 to
# disable it completely.
cl_weight: 0.5
cl_temperature: 0.2
dropout: 0.2

# Save the best-validation parameters and aligned mask analysis data.
save_analysis_artifacts: True
restore_best_model: True

hyper_parameters: []
