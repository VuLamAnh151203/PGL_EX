embedding_size: 64
feat_embed_dim: 64
dual_modal_branch_dim: 128
dual_modal_output_dim: 128

learning_rate_scheduler: [0.96, 50]
learning_rate: 0.001

n_mm_layers: 1
n_ui_layers: 2
knn_k: 10
mm_image_weight: 0.1

# Base PGL losses and graph settings.
cl_weight: 0.05
cl_temperature: 0.2
dropout: 0.2
mask_weight: 0.1
mask_keep_ratio: 0.3
mask_binary_weight: 0.1
mask_degree_mode: full
mask_graph_mode: hard
user_embedding_mode: separate
ui_branch_mode: dual
hard_mask_temperature: 1.0

# Parent initialization only. PGL_MASKED_CF replaces the per-edge residual
# with score = q_sem + lambda_c * g_phi(edge).
semantic_mask_variant: semantic_only
lambda_sem: 1.0

# Counterfactual synergy supervision.
lambda_c: 1.0
lambda_cf: 0.1
cf_samples_per_batch: 2
cf_warmup_epochs: 10
cf_hidden_dim: 32
cf_huber_beta: 0.1
cf_rank_temperature: 0.2
cf_min_tau_gap: 0.000001

save_analysis_artifacts: True
restore_best_model: True

hyper_parameters: []
